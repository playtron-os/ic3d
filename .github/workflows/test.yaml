name: 🪲 Test

on:
  # A branch is tested through its pull request; testing every push too ran it twice.
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Install Task
        uses: go-task/setup-task@v1
      - uses: actions/checkout@v3
      - run: |
          task docker:run TARGET='ci'
        env:
          SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}

  crates-io:
    name: Test the crates.io build
    runs-on: ubuntu-latest

    steps:
      - name: Install Task
        uses: go-task/setup-task@v1
      - uses: actions/checkout@v3
      - run: |
          task docker:run TARGET='test:crates-io'
        env:
          SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
